services:
  postgres:
    image: postgres:16-alpine
    container_name: manimart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manimart_db
      POSTGRES_USER: manimart_user
      POSTGRES_PASSWORD: manimart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manimart_user -d manimart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  manimart:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manimart_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 8080
      DB_TYPE: "postgres"
      DB_HOST: "postgres"
      DB_PORT: 5432
      DB_NAME: "manimart_db"
      DB_USER: "manimart_user"
      DB_PASSWORD: "manimart_password"
      AI_PROVIDER: "mock"
      GEMINI_API_KEY: ""
    volumes:
      - ./frontend:/app/frontend:ro
      - ./config:/app/config:ro

volumes:
  postgres_data:
