<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANI MART</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MANI MART</h1>

        <input type="text" placeholder="Search products...">

        <button>Login</button>
        <button>Cart 🛒</button>
    </header>

    <main>
        <h2>Welcome to MANI MART</h2>
        <p>Shop your favourite products</p>

        <section class="products">

            <div class="product">
                <h3>Laptop</h3>
                <p>₹45,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>Mobile</h3>
                <p>₹18,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>Headphones</h3>
                <p>₹2,000</p>
                <button>Add to Cart</button>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
