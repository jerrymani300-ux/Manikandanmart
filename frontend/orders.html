<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ManiMart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">M</div>
        <span>ManiMart</span>
      </a>

      <ul class="nav-links">
        <li><a href="products.html" class="nav-link">Explore</a></li>
        <li>
          <a href="cart.html" class="nav-link">
            🛒 Cart <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </li>
        <li id="nav-auth-controls"></li>
      </ul>
    </div>
  </header>

  <!-- Orders Content -->
  <main class="main-content">
    <div class="section-header">
      <div>
        <h1 class="section-title">My Orders</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Track your package delivery status and leave verified reviews on completed purchases.</p>
      </div>
    </div>

    <div id="orders-list">
      <!-- Populated via orders.js -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">&copy; 2026 ManiMart Marketplace.</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/chatbot.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Orders.init();
    });
  </script>
</body>
</html>
